replicaCount: 2

config:
  cleanupInterval: "1h"
  volumes:
    privateWorkarea:
      pvc:
        size: "5Gi"
        storageClass: "ceph"
  ssotap: "ssotap"
  hipsUrl: "https://data.lsst.cloud/api/hips/v2/dp1/deep_coadd/band_r"

redis:
  persistence:
    enabled: true
    size: "2Gi"
    storageClass: "standard-rwo"
  resources:
    limits:
      memory: "1Gi"

resources:
  limits:
    cpu: "2"
    memory: "16Gi"
  requests:
    cpu: "1"
    memory: "2Gi"
