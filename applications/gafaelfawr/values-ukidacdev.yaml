redis:
  persistence:
    enabled: false

config:
  internalDatabase: true

  oidcServer:
    enabled: true

  updateSchema: true
  
  oidc:
    clientId: "rsp-test"
    audience: "rsp-test"
    loginUrl: "https://aai-test.lsst.ac.uk/realms/lsst/protocol/openid-connect/auth"
    tokenUrl: "https://aai-test.lsst.ac.uk/realms/lsst/protocol/openid-connect/token"
    issuer: "https://aai-test.lsst.ac.uk/realms/lsst"
    scopes:
      - "openid"
    usernameClaim: "preferred_username"

  ldap:
    url: "ldap://aai-test.lsst.ac.uk"
    userDn: "cn=admin,dc=test,dc=lsst,dc=ac,dc=uk"
    userBaseDn: "ou=users,dc=test,dc=lsst,dc=ac,dc=uk"
    uidAttr: "uidNumber"
    gidAttr: "gidNumber"
    groupBaseDn: "ou=groups,dc=test,dc=lsst,dc=ac,dc=uk"
    groupMemberAttr: "memberUid"
    groupSearchByDn: false

  groupMapping:
    "admin:oidc":
      - github:
          organization: "lsp-uk"
          team: "dev"
    "admin:token":
      - github:
          organization: "lsp-uk"
          team: "dev"
    "admin:userinfo":
      - "rsp"
    "exec:admin":
      - "rsp"
    "exec:internal-tools":
      - "users"
      - "rsp"
    "exec:notebook":
      - "rsp"
    "exec:portal":
      - "rsp"
    "exec:portal-admin":
      - "rsp"
    "read:image":
      - "rsp"
    "read:tap":
      - "rsp"
