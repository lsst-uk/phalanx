strimzi-kafka:
  kafka:
    listeners:
      tls:
        enabled: true
      plain:
        enabled: false
      external:
        enabled: false
  controller:
    enabled: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoreDuringExecution:
          - podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - kafka
            topologyKey: kubernetes.io/hostname
        weight: 1
    storage:
      size: "5Gi"
  broker:
    enabled: true
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoreDuringExecution:
          - podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - kafka
            topologyKey: kubernetes.io/hostname
        weight: 1
    storage:
      size: "5Gi"
  users:
    telegraf:
      enabled: false
    replicator:
      enabled: false
  connect:
    enabled: false
  cruiseControl:
    enabled: false
  kafkaExporter:
    enabled: false

schema-registry:
  enabled: true
  ingress:
    enabled: true

influxdb:
  enabled: false

chronograf:
  enabled: false

kapacitor:
  enabled: false

kafdrop:
  enabled: false

app-metrics:
  enabled: false

telegraf:
  enabled: false

telegraf-standby:
  enabled: false

tap:
  enabled: true
